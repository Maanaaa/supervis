<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="serverCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="coreCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="dbCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="clientCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .node-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <line x1="50" y1="0" x2="50" y2="620" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="250" y1="0" x2="250" y2="620" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="500" y1="0" x2="500" y2="620" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="750" y1="0" x2="750" y2="620" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="950" y1="0" x2="950" y2="620" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="120" x2="1000" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="360" x2="1000" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Header Section -->
  <text x="50" y="48" class="title" font-size="20">Architecture Système — Supervision d'Alertes &amp; Astreinte</text>
  <text x="50" y="70" class="subtitle">Flux d'ingestion hybride (Push &amp; Pull), persistance NoSQL et diffusion WebSockets temps réel</text>

  <!-- ==================== BLOC GAUCHE 1 : SERVEURS POUSSEURS (PUSH) ==================== -->
  <g transform="translate(50, 120)" filter="url(#glow-rose)">
    <rect width="240" height="110" rx="12" fill="url(#serverCardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
    <!-- Icon Server Alert -->
    <path d="M 22 23 L 34 23 M 22 28 L 34 28 M 22 33 L 30 33" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="33" r="2" fill="#fb7185"/>

    <text x="52" y="27" class="node-title">Agents &amp; Serveurs</text>
    <text x="52" y="42" class="node-desc">Détection d'anomalies internes</text>
    <text x="16" y="80" class="node-desc" fill="#94a3b8">• Alertes CPU &gt; 95%, Disque saturé</text>
    <text x="16" y="98" class="node-desc" fill="#94a3b8">• Panne applicative (Nginx, MySQL)</text>

    <rect x="170" y="14" width="56" height="20" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="198" y="28" text-anchor="middle" class="node-tag" fill="#fb7185">PUSH</text>
  </g>

  <!-- ==================== BLOC GAUCHE 2 : SERVEURS SURVEILLES (PULL) ==================== -->
  <g transform="translate(50, 270)" filter="url(#glow-cyan)">
    <rect width="240" height="110" rx="12" fill="url(#serverCardGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#0ea5e9" fill-opacity="0.15"/>
    <!-- Icon Server Pulse -->
    <path d="M 20 28 L 24 28 L 27 22 L 31 34 L 34 28 L 36 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="52" y="27" class="node-title">Parc Serveurs Cibles</text>
    <text x="52" y="42" class="node-desc">Surveillance de disponibilité</text>
    <text x="16" y="80" class="node-desc" fill="#94a3b8">• Vérification HTTP / Ping TCP</text>
    <text x="16" y="98" class="node-desc" fill="#94a3b8">• Détection coupure totale (DOWN)</text>

    <rect x="175" y="14" width="51" height="20" rx="4" fill="#0ea5e9" fill-opacity="0.2"/>
    <text x="200" y="28" text-anchor="middle" class="node-tag" fill="#38bdf8">PULL</text>
  </g>

  <!-- ==================== BLOC CENTRE : BACKEND NODE.JS ==================== -->
  <g transform="translate(380, 120)" filter="url(#glow-indigo)">
    <rect width="260" height="260" rx="14" fill="url(#coreCardGrad)" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Header Node -->
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <!-- Node Logo shape -->
    <path d="M 32 24 L 40 28.5 L 40 37.5 L 32 42 L 24 37.5 L 24 28.5 Z" stroke="#818cf8" stroke-width="1.8" fill="none"/>
    <text x="58" y="32" class="node-title">Serveur Backend</text>
    <text x="58" y="48" class="node-desc">Node.js · Express · Socket.IO</text>

    <!-- Sub-modules inside Backend -->
    <!-- Module 1: Ingestion API -->
    <rect x="16" y="70" width="228" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="90" class="node-desc" font-weight="600" fill="#f8fafc">API REST d'Ingestion</text>
    <text x="28" y="106" class="node-desc" font-size="11" fill="#94a3b8">Route POST /api/alerts (Webhooks)</text>

    <!-- Module 2: Sonde Poller -->
    <rect x="16" y="128" width="228" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="148" class="node-desc" font-weight="600" fill="#f8fafc">Sonde Périodique (Poller)</text>
    <text x="28" y="164" class="node-desc" font-size="11" fill="#94a3b8">Promise.allSettled · Heartbeat async</text>

    <!-- Module 3: Event Emitter -->
    <rect x="16" y="186" width="228" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="206" class="node-desc" font-weight="600" fill="#f8fafc">Hub Temps Réel Socket.IO</text>
    <text x="28" y="222" class="node-desc" font-size="11" fill="#94a3b8">Diffusion d'état &amp; ACK opérateur</text>
  </g>

  <!-- ==================== BLOC DROITE HAUT : MONGODB ==================== -->
  <g transform="translate(730, 120)" filter="url(#glow-emerald)">
    <rect width="220" height="150" rx="12" fill="url(#dbCardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <!-- DB Cylinder Icon -->
    <ellipse cx="28" cy="24" rx="7" ry="3" stroke="#34d399" stroke-width="1.8" fill="none"/>
    <path d="M 21 24 L 21 34 A 7 3 0 0 0 35 34 L 35 24" stroke="#34d399" stroke-width="1.8" fill="none"/>

    <text x="50" y="27" class="node-title">Base MongoDB</text>
    <text x="50" y="42" class="node-desc">Persistance NoSQL</text>

    <!-- Collections -->
    <rect x="14" y="66" width="192" height="22" rx="4" fill="#022c22" stroke="#065f46" stroke-width="1"/>
    <text x="22" y="81" class="node-desc" font-size="11" fill="#6ee7b7">📁 collection: servers</text>

    <rect x="14" y="93" width="192" height="22" rx="4" fill="#022c22" stroke="#065f46" stroke-width="1"/>
    <text x="22" y="108" class="node-desc" font-size="11" fill="#6ee7b7">📁 collection: alerts</text>

    <rect x="14" y="120" width="192" height="22" rx="4" fill="#022c22" stroke="#065f46" stroke-width="1"/>
    <text x="22" y="135" class="node-desc" font-size="11" fill="#6ee7b7">📁 collection: users (astreinte)</text>
  </g>

  <!-- ==================== BLOC BAS : DASHBOARD ASTREINTE ==================== -->
  <g transform="translate(380, 440)" filter="url(#glow-violet)">
    <rect width="570" height="140" rx="14" fill="url(#clientCardGrad)" stroke="#a855f7" stroke-width="1.8"/>

    <!-- Header Client -->
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#a855f7" fill-opacity="0.2"/>
    <!-- Screen Icon -->
    <rect x="22" y="23" width="20" height="14" rx="2" stroke="#c084fc" stroke-width="1.8" fill="none"/>
    <line x1="28" y1="41" x2="36" y2="41" stroke="#c084fc" stroke-width="1.8"/>

    <text x="58" y="32" class="node-title">Dashboard Web Astreinte (Navigateurs Clients)</text>
    <text x="58" y="48" class="node-desc">Interface temps réel sans rechargement de page · Coordination d'équipe</text>

    <!-- Features Dashboard -->
    <!-- Card 1: Alertes -->
    <rect x="16" y="68" width="168" height="56" rx="8" fill="#1e1035" stroke="#4c1d95" stroke-width="1"/>
    <text x="26" y="88" class="node-desc" font-weight="600" fill="#f5d0fe">🚨 Urgences Actives</text>
    <text x="26" y="104" class="node-desc" font-size="10.5" fill="#d8b4fe">Statut OPEN (Rouge)</text>
    <text x="26" y="117" class="node-desc" font-size="10" fill="#a78bfa">Notification sonore</text>

    <!-- Card 2: Astreinte ACK -->
    <rect x="194" y="68" width="180" height="56" rx="8" fill="#1e1035" stroke="#4c1d95" stroke-width="1"/>
    <text x="204" y="88" class="node-desc" font-weight="600" fill="#f5d0fe">👤 « Qui s'en occupe »</text>
    <text x="204" y="104" class="node-desc" font-size="10.5" fill="#d8b4fe">Prise en charge (ACK)</text>
    <text x="204" y="117" class="node-desc" font-size="10" fill="#a78bfa">Attribution opérateur en 1 clic</text>

    <!-- Card 3: Clôture -->
    <rect x="384" y="68" width="170" height="56" rx="8" fill="#1e1035" stroke="#4c1d95" stroke-width="1"/>
    <text x="394" y="88" class="node-desc" font-weight="600" fill="#f5d0fe">⏱️ « Quand c'est réglé »</text>
    <text x="394" y="104" class="node-desc" font-size="10.5" fill="#d8b4fe">Résolu (RESOLVED)</text>
    <text x="394" y="117" class="node-desc" font-size="10" fill="#a78bfa">Horodatage &amp; archivage</text>
  </g>

  <!-- ==================== CONNECTEURS & FLÈCHES ==================== -->

  <!-- FLÈCHE 1 : Push -> Backend -->
  <path d="M 290 175 L 380 175" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <rect x="298" y="153" width="75" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
  <text x="335" y="165" text-anchor="middle" class="flow-label" fill="#fb7185">POST /alerts</text>

  <!-- FLÈCHE 2 : Backend <-> Sonde Pull -->
  <!-- Poller interroge le serveur cible -->
  <path d="M 380 325 L 290 325" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <rect x="300" y="303" width="70" height="18" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="335" y="315" text-anchor="middle" class="flow-label" fill="#38bdf8">Healthcheck</text>

  <!-- FLÈCHE 3 : Backend <-> MongoDB -->
  <path d="M 640 195 L 730 195" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 730 205 L 640 205" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <rect x="652" y="180" width="65" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="684" y="192" text-anchor="middle" class="flow-label" fill="#34d399">Mongoose</text>

  <!-- FLÈCHE 4 : Backend <-> Dashboard (Socket.io) -->
  <path d="M 480 380 L 480 440" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <path d="M 520 440 L 520 380" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <rect x="440" y="398" width="120" height="24" rx="5" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="500" y="414" text-anchor="middle" class="flow-label" fill="#e9d5ff">Socket.IO (Events)</text>

</svg>
