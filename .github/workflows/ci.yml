name: CI - Qualité de Code & Validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  code-quality:
    name: Lint, Types, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🔍 Vérification statique des types (TypeScript)
        run: npm run typecheck

      - name: 🧹 Vérification des règles & patterns (ESLint)
        run: npm run lint

      - name: 📐 Vérification du formatage & indentation (Prettier)
        run: npm run format:check

      - name: 🧪 Exécution des tests automatisés (Unit, Fonc, E2E)
        run: npm test

      - name: 🏗️ Test de compilation & build (Next.js)
        run: npm run build
